# Stage A: passive thermistor inputs only.  No steppers, heaters, fans, or probe.

[include f005-common-mcu.cfg]

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

[temperature_sensor hotend_thermistor]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: 0
max_temp: 320

[temperature_sensor bed_thermistor]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 120
