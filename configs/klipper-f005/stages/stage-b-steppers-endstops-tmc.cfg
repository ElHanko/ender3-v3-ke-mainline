# Stage B: steppers, physical endstops, and TMC UART.  No probe, heater, or fan.

[include f005-common-mcu.cfg]

[printer]
kinematics: cartesian
max_velocity: 20
max_accel: 100
max_z_velocity: 5
max_z_accel: 50
square_corner_velocity: 2

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -12
position_min: -12
position_max: 221
homing_speed: 10
homing_retract_dist: 0

[tmc2208 stepper_x]
uart_pin: PB12
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 60
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 223
homing_speed: 10
homing_retract_dist: 0

[tmc2208 stepper_y]
uart_pin: PB13
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
# Stage B uses PC14 solely as a raw config placeholder so this Cartesian
# surface can load before the probe is introduced in Stage C. Its polarity and
# mechanical meaning are not a Stage-B result; Z homing is prohibited here.
endstop_pin: PC14
position_endstop: 0
position_max: 246
position_min: -5
homing_speed: 5
homing_retract_dist: 0

[tmc2208 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0

# The historical Stage-B configuration included a manual_stepper to expose the
# E motor pins without creating a heater object.
[manual_stepper extruder]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
velocity: 5
accel: 50
