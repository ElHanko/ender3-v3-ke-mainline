# Stage D: fans and heaters after Stage C passes.  This historical staged
# candidate intentionally uses watermark control; it is not the final baseline.

[include stage-c-bltouch-homing.cfg]

[extruder]
max_extrude_only_distance: 1000
max_extrude_cross_section: 80
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 7.53
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
control: watermark
min_temp: 0
max_temp: 320

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: watermark
min_temp: 0
max_temp: 120

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[fan]
pin: PA0
cycle_time: 0.010
hardware_pwm: False
shutdown_speed: 0

[heater_fan hotend_fan]
pin: PC1
max_power: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.100
off_below: 0.0
heater: extruder
fan_speed: 1.0
heater_temp: 60.0

[output_pin mainboard_fan]
pin: !PB1
value: 0
shutdown_value: 0
