# Stage C: BLTouch and carefully staged homing.  Apply the test-only no-retry
# patch before using this configuration.

[include f005-common-mcu.cfg]

[printer]
kinematics: cartesian
max_velocity: 20
max_accel: 100
max_z_velocity: 5
max_z_accel: 50
square_corner_velocity: 2

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -12
position_min: -12
position_max: 221
homing_speed: 10
homing_retract_dist: 0

[tmc2208 stepper_x]
uart_pin: PB12
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 60
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 223
homing_speed: 10
homing_retract_dist: 0

[tmc2208 stepper_y]
uart_pin: PB13
interpolate: True
run_current: 0.75
sense_resistor: 0.150
stealthchop_threshold: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 246
position_min: -5

[tmc2208 stepper_z]
uart_pin: PB14
interpolate: True
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0

[bltouch]
sensor_pin: PC14
control_pin: PC13
x_offset: 0
y_offset: 27
# The exact pre-PROBE_CALIBRATE Stage-C value was not retained. This neutral
# parser placeholder is not a calibration result and must not be printed with.
# The observed calibration result was 1.800; the Stage-F reference is 1.900.
z_offset: 0
probe_with_touch_mode: True
stow_on_each_sample: False
speed: 5
lift_speed: 20

[safe_z_home]
home_xy_position: 110, 83
z_hop: 5
z_hop_speed: 20
