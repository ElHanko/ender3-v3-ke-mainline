# OFFLINE VALIDATION CANDIDATE
# NOT HARDWARE VALIDATED
# NOT READY FOR PRINTING
# NOT READY TO FLASH
# For the investigated F005/GD32F303RET6 reference only.

[mcu]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 8000
max_z_velocity: 30
max_z_accel: 300
square_corner_velocity: 5.0

# Cartesian kinematics requires its three rails during config loading. The Z
# rail uses the normal BLTouch virtual endstop, so the corresponding probe is
# also needed even though this config issues no homing command.
[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: !PA5
position_endstop: -12
position_min: -12
position_max: 221
homing_speed: 30
homing_retract_dist: 0

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 60
endstop_pin: !PA6
position_endstop: -20
position_min: -20
position_max: 223
homing_speed: 30
homing_retract_dist: 0

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 246
position_min: -5

[bltouch]
sensor_pin: PC14
control_pin: PC13
x_offset: 0
y_offset: 27
# Placeholder required for offline config parsing.
# MUST be calibrated on the actual printer before homing/printing use.
z_offset: 0
probe_with_touch_mode: True
stow_on_each_sample: False
speed: 5
lift_speed: 20
